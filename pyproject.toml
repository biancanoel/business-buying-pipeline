[project]
name = "business-finder"
version = "0.1.0"
description = "Finds small businesses for sale that match saved search criteria and posts new matches to Slack."
readme = "README.md"
authors = [
    { name = "Bianca Poling" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.12.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "faker>=40.43.0",
    "hypothesis>=6.168.5",
    "pytest>=9.1.1",
]
